name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit suite (parsers, state, catalogs)
        run: node tests/sportsmodel.test.mjs

      - name: Offline regression (frozen fixtures vs goldens)
        run: node tests/offline.mjs

      - name: Chaos & Edge-case Scenarios
        run: node tests/scenarios.mjs

      - name: Notification & Delivery Suite
        run: node tests/notifications.mjs

      - name: Crest Resilience & Fallbacks
        run: node tests/crest-resilience.mjs

      - name: Burn-In & Memory Stability
        run: node tests/burnin.mjs

  qml-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev qml6-module-qtquick

      - name: QML syntax check
        run: |
          set -euo pipefail
          LINT=$(command -v qmllint6 || command -v qmllint || echo /usr/lib/qt6/bin/qmllint)
          out_file=$(mktemp)
          set +e
          "$LINT" ./*.qml >"$out_file" 2>&1
          set -e
          cat "$out_file"
          # qmllint on ubuntu-latest exits non-zero for unresolved qs.*
          # imports (Quickshell types are not on the CI import path). Ignore
          # the exit code and fail only on real syntax errors: a leading
          # "Error:" line, or "Syntax error [syntax]" (two-root documents,
          # etc. are reported as warnings in some qmllint versions).
          if grep -qE '^Error([: ]|$)|Syntax error \[syntax\]' "$out_file"; then
            echo "::error::qmllint reported syntax errors"
            exit 1
          fi
          echo "QML syntax check passed (unresolved qs.* imports are environment warnings)"

      - name: Guard against dead self-recursive functions
        run: |
          set -e
          if grep -nE 'function theme\.mutedColor\(c, a\) \{[[:space:]]*return theme\.mutedColor' *.qml; then
            echo "::error::dead self-recursive theme.mutedColor declarations found"
            exit 1
          fi
