name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit suite (parsers, state, catalogs)
        run: node tests/sportsmodel.test.mjs

      - name: Offline regression (frozen fixtures vs goldens)
        run: node tests/offline.mjs

  qml-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev qml6-module-qtquick

      - name: QML syntax check
        run: |
          set -euo pipefail
          LINT=$(command -v qmllint6 || command -v qmllint || echo /usr/lib/qt6/bin/qmllint)
          out_file=$(mktemp)
          set +e
          "$LINT" ./*.qml >"$out_file" 2>&1
          lint_status=$?
          set -e
          cat "$out_file"
          if [ "$lint_status" -ne 0 ] || grep -qE '^Error([: ]|$)' "$out_file"; then
            echo "::error::qmllint reported syntax errors"
            exit 1
          fi
          echo "QML syntax check passed (unresolved qs.* imports are environment warnings)"
