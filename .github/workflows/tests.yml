name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit suite (parsers, state, catalogs)
        run: node tests/sportsmodel.test.mjs

      - name: Offline regression (frozen fixtures vs goldens)
        run: node tests/offline.mjs

  qml-syntax:
    runs-on: ubuntu-latest
    continue-on-error: true # environmental warnings from qs.* modules must not block CI
    steps:
      - uses: actions/checkout@v4

      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev qml6-module-qtquick

      - name: QML syntax check
        run: qmllint6 *.qml || qmllint *.qml || /usr/lib/qt6/bin/qmllint *.qml
