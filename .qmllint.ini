[General]
DisableDefaultImports=false
MaxWarnings=-1
OnlyExplicitCategories=false
Warnings=warning

[Warnings]
# Quickshell's qs.Commons/qs.Ui singletons and QML ids are used unqualified
# throughout the plugin by design; renaming every access would add churn
# without improving runtime behavior.
UnqualifiedAccess=disable
# Loader.item is statically QObject, so members provided by Panel.qml cannot be
# resolved without a component-level type annotation Quickshell does not expose.
MissingProperty=disable
# The codebase intentionally uses function-scoped `var` for Qt 5/6 QML JS
# compatibility. let/const are supported, but a wholesale rewrite is not worth
# the regression risk in a plugin that must run in the long-lived shell.
BlockScopeVarDeclaration=disable
# Property aliases deliberately share their target id (e.g. `sportPicker`).
IdShadowsMember=disable
# Object-literal bindings to QVariantHash properties are a qmllint false
# positive for Quickshell Process.environment.
IncompatibleType=info
# Qt 6 QML still reports a handful of intentional property overrides on
# Quickshell base types; keep them visible but non-blocking.
PropertyOverride=info
UnusedImports=info
CompilerWarnings=disable
